name: Push Github Private NPM Registry

on:
  push:
    branches:
      - master

jobs:
  publish:
    permissions:
      id-token: write
      contents: read
    uses: CoolBitX-Technology/cp-workflow-template/.github/workflows/build_and_publish_official_public_npm_package_oidc.yml@master
  notify:
    needs: publish
    uses: CoolBitX-Technology/cp-workflow-template/.github/workflows/notify_slack.yml@master
    secrets:
      CP_SLACK_CHANNEL_RG_CRYPTO: ${{ secrets.CP_SLACK_CHANNEL_RG_CRYPTO }}
